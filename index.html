<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kessler Syndrome Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/4.0.0/satellite.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        canvas { display: block; }
        #ui-container {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            width: 350px;
          }
          #date-slider {
            width: 100%;
          }
          #warning {
            color: red;
            font-weight: bold;
          }
              /* Footer */
        #footer {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            font-size: 14px;
            border-radius: 5px;
        }
            /* Legend (Key) */
            #legend {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        .legend-color {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 10px;
        }
        .blue { background: #00aaff; } /* Starlink */
        .red { background: #ff0000; } /* Other Satellites */
        .yellow { background: #ff8800; } /* Debris */
    </style>
</head>
<body>
  <div id="ui-container">
      
        <p id="date-display">Date: <span id="date-value">2026</span></p>
        <input type="range" id="date-slider" min="2024" max="2100" step="1" value="2026">
        <p id="satellite-count">Loading Satellites...</p>
        <p id="warning">No issues yet.</p>
    </div>
    <div id="footer">Made by Michael Watts © 2026</div>

    <div id="legend">
      <p><strong>Key:</strong></p>
      <div class="legend-item"><span class="legend-color blue"></span> Starlink Satellites</div>
      <div class="legend-item"><span class="legend-color red"></span> Other Satellites</div>
      <div class="legend-item"><span class="legend-color yellow"></span> Space Debris</div>
  </div>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const textureLoader = new THREE.TextureLoader();
        const earthTexture = textureLoader.load('./earth.jpg');
        const starsTexture = textureLoader.load('./stars.jpg');

        const earthGeometry = new THREE.SphereGeometry(1, 64, 64);
        const earthMaterial = new THREE.MeshStandardMaterial({ map: earthTexture });
        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        scene.add(earth);

        const starGeometry = new THREE.SphereGeometry(50, 64, 64);
        const starMaterial = new THREE.MeshBasicMaterial({ map: starsTexture, side: THREE.BackSide });
        const starfield = new THREE.Mesh(starGeometry, starMaterial);
        scene.add(starfield);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
        sunLight.position.set(5, 3, 5);
        scene.add(sunLight);
        const ambientLight = new THREE.AmbientLight(0x222222);
        scene.add(ambientLight);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        camera.position.z = 3;

        const dateDisplay = document.getElementById("date-value");
        const dateSlider = document.getElementById("date-slider");
        const satelliteCountDisplay = document.getElementById("satellite-count");
        const warningMessage = document.getElementById("warning");

        let satellites = [];
        let debris = [];
        let debrisCount = 0;
        let kesslerTriggered = false;

        function latLonToXYZ(lat, lon, alt) {
            const radius = 1 + alt / 6371;
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            return new THREE.Vector3(
                radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );
        }

        function loadSatellites() {
            const hardcodedSatelliteCount = 26000;
            const satelliteGeometry = new THREE.SphereGeometry(0.008, 6, 6);
            const starlinkMaterial = new THREE.MeshBasicMaterial({ color: 0x00aaff });
            const otherSatelliteMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });

            for (let i = 0; i < hardcodedSatelliteCount; i++) {
                const lat = Math.asin(Math.random() * 2 - 1) * (180 / Math.PI);
                const lon = Math.random() * 360 - 180;
                const altitude = 200 + Math.random() * 1800;
                const pos = latLonToXYZ(lat, lon, altitude);
                const material = i % 2 === 0 ? starlinkMaterial : otherSatelliteMaterial;
                const satelliteMesh = new THREE.Mesh(satelliteGeometry, material);
                satelliteMesh.position.copy(pos);
                scene.add(satelliteMesh);
                satellites.push(satelliteMesh);
            }

            updateUI();
        }

        function updateUI() {
            satelliteCountDisplay.innerHTML = `Satellites: ${satellites.length} | Debris: ${debrisCount}`;
            updateWarnings();
        }

function updateWarnings() {
    if (debrisCount < 1000) {
        warningMessage.innerHTML = "🟢 LOW: Orbital traffic is operating normally.";
    } else if (debrisCount < 3000) {
        warningMessage.innerHTML = "🟡 ELEVATED: Collision debris is spreading through orbit.";
    } else if (debrisCount < 6000) {
        warningMessage.innerHTML = "🟠 HIGH: More objects are threatened by debris collisions.";
    } else if (debrisCount < 12000) {
        warningMessage.innerHTML = "🔴 CRITICAL: Repeated collisions are generating dangerous amounts of debris.";
    } else if (debrisCount < 26000) {
        warningMessage.innerHTML = "🚨 CASCADE: Debris is multiplying and threatening satellite operations.";
    } else {
        warningMessage.innerHTML = "🌍 KESSLER SYNDROME: Some orbital regions may become extremely difficult to use!";
    }
}

        function triggerKesslerEvent() {
    if (satellites.length < 2) return;

    // Destroy two satellites per collision
    const destroyedSatellites = 2;

    // Each collision generates 1,000 simulated fragments
    const fragmentsPerCollision = 1000;

    for (let i = 0; i < destroyedSatellites; i++) {
        const sat = satellites.pop();
        if (!sat) continue;

        scene.remove(sat);
    }

    // Distribute debris around Earth's orbit
    for (let j = 0; j < fragmentsPerCollision; j++) {
        const debrisMesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.005, 4, 4),
            new THREE.MeshBasicMaterial({ color: 0xff8800 })
        );

        const phi = Math.random() * Math.PI * 2;
        const theta = Math.random() * Math.PI;

        const radius = 1.1 + Math.random() * 0.3;

        debrisMesh.position.set(
            radius * Math.sin(theta) * Math.cos(phi),
            radius * Math.cos(theta),
            radius * Math.sin(theta) * Math.sin(phi)
        );

        scene.add(debrisMesh);
        debris.push(debrisMesh);
        debrisCount++;
    }

    updateUI();
}

        dateSlider.addEventListener("input", () => {
            dateDisplay.textContent = dateSlider.value;

            if (dateSlider.value === "2024") {
                location.reload(); // Full reset on 2024
            } else if (dateSlider.value >= 2036) {
                triggerKesslerEvent();
            }
        });

        loadSatellites();

        function animate() {
            requestAnimationFrame(animate);
            earth.rotation.y += 0.001;
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
